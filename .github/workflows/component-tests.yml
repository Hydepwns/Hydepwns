name: Component Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'assets/js/components/**'
      - 'test/js/components/**'
      - 'test/hydepwns_liveview_web/js/**'
      - 'test/js/e2e/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'assets/js/components/**'
      - 'test/js/components/**'
      - 'test/hydepwns_liveview_web/js/**'
      - 'test/js/e2e/**'

jobs:
  test:
    name: Component Testing
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run component tests
      id: component-tests
      run: npm run test:components
      
    - name: Generate coverage report
      id: coverage
      run: npm run test:components:coverage
      
    - name: Run accessibility tests
      id: a11y
      run: npm run test:a11y
      
    - name: Run E2E tests
      id: e2e
      run: npm run test:e2e:ci
      
    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: coverage/
        
    - name: Upload accessibility report
      uses: actions/upload-artifact@v3
      with:
        name: accessibility-report
        path: accessibility-report/
        
    - name: Upload E2E artifacts
      uses: actions/upload-artifact@v3
      with:
        name: e2e-artifacts
        path: |
          test_artifacts/screenshots
          test_artifacts/videos
        
    - name: Check coverage thresholds
      run: |
        COVERAGE_REPORT=$(cat coverage/coverage-summary.json)
        STATEMENTS=$(echo $COVERAGE_REPORT | jq '.total.statements.pct')
        BRANCHES=$(echo $COVERAGE_REPORT | jq '.total.branches.pct')
        FUNCTIONS=$(echo $COVERAGE_REPORT | jq '.total.functions.pct')
        LINES=$(echo $COVERAGE_REPORT | jq '.total.lines.pct')
        
        if (( $(echo "$STATEMENTS < 80" | bc -l) )); then
          echo "Statement coverage ($STATEMENTS%) is below threshold (80%)"
          exit 1
        fi
        
        if (( $(echo "$BRANCHES < 75" | bc -l) )); then
          echo "Branch coverage ($BRANCHES%) is below threshold (75%)"
          exit 1
        fi
        
        if (( $(echo "$FUNCTIONS < 80" | bc -l) )); then
          echo "Function coverage ($FUNCTIONS%) is below threshold (80%)"
          exit 1
        fi
        
        if (( $(echo "$LINES < 80" | bc -l) )); then
          echo "Line coverage ($LINES%) is below threshold (80%)"
          exit 1
        fi
        
    - name: Generate test summary
      if: always()
      run: |
        echo "## Component Test Results" >> $GITHUB_STEP_SUMMARY
        echo "| Test Type | Status |" >> $GITHUB_STEP_SUMMARY
        echo "| --------- | ------ |" >> $GITHUB_STEP_SUMMARY
        echo "| Component Tests | ${{ steps.component-tests.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Coverage Checks | ${{ steps.coverage.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Accessibility Tests | ${{ steps.a11y.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| E2E Tests | ${{ steps.e2e.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        
        if [ -f "coverage/coverage-summary.json" ]; then
          COVERAGE_REPORT=$(cat coverage/coverage-summary.json)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "| ------ | -------- |" >> $GITHUB_STEP_SUMMARY
          echo "| Statements | $(echo $COVERAGE_REPORT | jq '.total.statements.pct')% |" >> $GITHUB_STEP_SUMMARY
          echo "| Branches | $(echo $COVERAGE_REPORT | jq '.total.branches.pct')% |" >> $GITHUB_STEP_SUMMARY
          echo "| Functions | $(echo $COVERAGE_REPORT | jq '.total.functions.pct')% |" >> $GITHUB_STEP_SUMMARY
          echo "| Lines | $(echo $COVERAGE_REPORT | jq '.total.lines.pct')% |" >> $GITHUB_STEP_SUMMARY
        fi 