name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

jobs:
  test:
    uses: ./.github/workflows/elixir-common.yml
    with:
      test_flags: "--exclude wallaby"
      coverage: true

  deploy-staging:
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    needs: test
    runs-on: ubuntu-latest
    # environment: staging
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.14.5'
          otp-version: '25.3'
      
      - name: Build release
        run: |
          mix deps.get
          mix compile
          mix release --overwrite
      
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # Example: rsync, docker push, or cloud deployment
      
      - name: Health check
        run: |
          echo "Performing health check..."
          # Add health check commands
          sleep 30
          curl -f http://staging.example.com/health || exit 1

  deploy-production:
    if: github.event.inputs.environment == 'production'
    needs: test
    runs-on: ubuntu-latest
    # environment: production
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.14.5'
          otp-version: '25.3'
      
      - name: Build release
        run: |
          mix deps.get
          mix compile
          mix release --overwrite
      
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
      
      - name: Health check
        run: |
          echo "Performing health check..."
          sleep 30
          curl -f http://production.example.com/health || exit 1
      
      - name: Notify deployment
        run: |
          echo "Production deployment completed successfully!"
          # Add notification commands (Slack, email, etc.)

  rollback:
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Rollback deployment
        run: |
          echo "Deployment failed, initiating rollback..."
          # Add rollback commands here
      
      - name: Notify rollback
        run: |
          echo "Rollback completed"
          # Add notification commands 