name: Documentation Validation

on:
  push:
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'scripts/**/*validation*.js'
      - 'scripts/**/*validation*.sh'
  pull_request:
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'scripts/**/*validation*.js'
      - 'scripts/**/*validation*.sh'

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Make validation script executable
      run: chmod +x scripts/ci_documentation_validation.sh
    
    - name: Run documentation validation
      run: ./scripts/ci_documentation_validation.sh
      env:
        CI_STRICT_VALIDATION: true
    
    - name: Archive validation results
      if: always()
      uses: actions/upload-artifact@v3.1.3
      with:
        name: documentation-validation-results
        path: |
          /tmp/missing_titles.txt
          scripts/validation-report.json
        retention-days: 7 