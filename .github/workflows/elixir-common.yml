name: Elixir Common

on:
  workflow_call:
    inputs:
      test_flags:
        required: false
        type: string
      coverage:
        required: false
        type: boolean
        default: false
      browser_tests:
        required: false
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hydepwns_liveview_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.14.5'
          otp-version: '25.3'
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgconf-2-4 \
            libnss3 \
            libxss1 \
            libasound2 \
            libxtst6 \
            xvfb
      
      - name: Cache deps
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      
      - name: Cache compiled build
        uses: actions/cache@v3
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-
      
      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: assets/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('assets/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-
      
      - name: Install dependencies
        run: mix deps.get
      
      - name: Install npm dependencies
        run: |
          cd assets
          npm ci
      
      - name: Compile
        run: mix compile --warnings-as-errors
      
      - name: Check formatting
        run: mix format --check-formatted
      
      - name: Run Credo
        run: mix credo --strict
      
      - name: Run unit tests
        run: mix test --exclude wallaby --exclude visual_test:true --exclude performance:true ${{ inputs.test_flags }}
      
      - name: Run browser tests
        if: ${{ inputs.browser_tests }}
        run: |
          # Start virtual display for Chrome
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          
          # Run Wallaby tests
          mix test --only wallaby
        env:
          DISPLAY: :99
      
      - name: Run Dialyzer
        run: mix dialyzer
      
      - name: Run coverage
        if: ${{ inputs.coverage }}
        run: mix coveralls.github
      
      - name: Upload coverage report
        if: ${{ inputs.coverage }}
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: cover/
      
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: test-artifacts
          path: |
            tmp/
            _build/
            priv/static/
      
      - name: Generate test summary
        if: always()
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Unit tests: ✅" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.browser_tests }}" = "true" ]; then
            echo "- Browser tests: ✅" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- Code quality: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Type checking: ✅" >> $GITHUB_STEP_SUMMARY 