name: Scheduled Documentation Validation

on:
  schedule:
    # Run weekly on Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  # Allow manual triggering
  workflow_dispatch:

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Validate documentation
        id: validate-docs
        run: npm run validate:docs
      
      - name: Generate validation report
        if: always()
        run: |
          echo "# Documentation Validation Report" > validation_report.md
          echo "## Summary" >> validation_report.md
          echo "Status: ${{ steps.validate-docs.outcome == 'success' && '✅ Passed' || '❌ Failed' }}" >> validation_report.md
          echo "" >> validation_report.md
          echo "## Details" >> validation_report.md
          echo "Run completed at: $(date)" >> validation_report.md
          
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const fs = require('fs');
            const reportContent = fs.readFileSync('validation_report.md', 'utf8');
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Documentation Validation Failed - $(date +"%Y-%m-%d")',
              body: reportContent + '\n\nThis issue was automatically created by the scheduled documentation validation workflow.',
              labels: ['documentation', 'automated']
            }); 