name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit:
    uses: ./.github/workflows/elixir-common.yml
    with:
      test_flags: "--exclude wallaby --exclude visual_test:true --exclude performance:true"
      coverage: true
  
  browser:
    uses: ./.github/workflows/elixir-common.yml
    with:
      test_flags: "--only wallaby"
      browser_tests: true
  
  visual:
    uses: ./.github/workflows/elixir-common.yml
    with:
      test_flags: "--only visual_test"
  
  performance:
    uses: ./.github/workflows/elixir-common.yml
    with:
      test_flags: "--only performance"
  
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.14.5'
          otp-version: '25.3'
      
      - name: Install dependencies
        run: mix deps.get
      
      - name: Security audit
        run: mix deps.audit
      
      - name: Check for secrets
        run: |
          # Check for potential secrets in code
          if grep -r "password.*=.*['\"][^'\"]*['\"]" lib/ --exclude-dir=_build; then
            echo "⚠️  Potential hardcoded passwords found"
            exit 1
          fi
